name: shervice_flutter
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.15.0
  qr_flutter: ^4.1.0
  fl_chart: ^0.70.2
  file_picker: ^12.1.2
  excel: ^4.0.6
  spreadsheet_decoder: ^2.3.0
  http_parser: ^4.1.2
  skeletonizer: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1   # ✅ Added here

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
    - assets/shervice.jpg
    - assets/shervice - white.jpg

# ✅ Top-level (outside "flutter:")
flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo2.jpg"
  adaptive_icon_background: "#1E293B"          # optional – dark blue background
  adaptive_icon_foreground: "assets/logo2.jpg"  # optional – same logo