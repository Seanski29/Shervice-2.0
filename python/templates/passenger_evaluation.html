<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passenger Driver Evaluation</title>
<style>
body{margin:0;padding:24px;background:#f8fafc;color:#1e293b;font-family:Arial,sans-serif}main{max-width:520px;margin:32px auto;background:white;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px #0f172a14}header{padding:28px;text-align:center;color:white;background:#12366b}section{padding:24px}label{display:block;margin:18px 0 7px;font-weight:700}select,textarea,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{margin-top:24px;color:white;background:#1d4ed8;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.notice{color:#475569;font-size:14px;line-height:1.5}.error{color:#b91c1c;background:#fef2f2;padding:12px;border-radius:8px}.success{text-align:center;padding:32px 24px}
</style>
</head>
<body><main><header><h1>SHERVICE</h1><div>Anonymous Passenger Feedback</div></header>
<section id="formSection"><p class="notice">Your feedback is anonymous. Please select the driver you want to evaluate.</p><p id="error" class="error" hidden></p>
<form id="evaluationForm">
<label for="driver">Driver</label><select id="driver" required><option value="">Loading drivers…</option></select>
<label for="safety">Safety of the ride</label><select id="safety" required><option value="">Select rating</option><option value="5">5 - Excellent</option><option value="4">4 - Good</option><option value="3">3 - Average</option><option value="2">2 - Poor</option><option value="1">1 - Terrible</option></select>
<label for="punctuality">Punctuality</label><select id="punctuality" required><option value="">Select rating</option><option value="5">5 - Excellent</option><option value="4">4 - Good</option><option value="3">3 - Average</option><option value="2">2 - Poor</option><option value="1">1 - Terrible</option></select>
<label for="professionalism">Driver professionalism</label><select id="professionalism" required><option value="">Select rating</option><option value="5">5 - Excellent</option><option value="4">4 - Good</option><option value="3">3 - Average</option><option value="2">2 - Poor</option><option value="1">1 - Terrible</option></select>
<label for="comments">Additional comments (optional)</label><textarea id="comments" rows="4" maxlength="2000" placeholder="Tell us about your experience"></textarea>
<button id="submit" type="submit">Submit Anonymous Evaluation</button></form></section>
<section id="success" class="success" hidden><h2>Thank you!</h2><p>Your anonymous feedback was submitted successfully.</p></section></main>
<script>
const token={{ token|tojson }};const apiBase=token?`/api/evaluate/passenger-survey/${encodeURIComponent(token)}`:'/api/evaluate/passenger-survey';const submitBase=token?apiBase:'/api/evaluate/passenger-submit';const errorBox=document.getElementById('error');const showError=m=>{errorBox.textContent=m;errorBox.hidden=false};
async function loadDrivers(){try{const r=await fetch(apiBase);const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'This survey link is unavailable.');const s=document.getElementById('driver');s.innerHTML='<option value="">Select a driver</option>';for(const x of d.drivers){const o=document.createElement('option');o.value=x.driver_id;o.textContent=x.full_name||`Driver ${x.driver_id}`;s.appendChild(o)}}catch(e){showError(e.message);document.getElementById('evaluationForm').hidden=true}}
document.getElementById('evaluationForm').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit');b.disabled=true;b.textContent='Submitting…';const p={driver_id:document.getElementById('driver').value,safety_score:document.getElementById('safety').value,punctuality_score:document.getElementById('punctuality').value,professionalism_score:document.getElementById('professionalism').value,comments:document.getElementById('comments').value};try{const r=await fetch(submitBase,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Unable to submit evaluation.');document.getElementById('formSection').hidden=true;document.getElementById('success').hidden=false}catch(x){showError(x.message);b.disabled=false;b.textContent='Submit Anonymous Evaluation'}});loadDrivers();
</script></body></html>
